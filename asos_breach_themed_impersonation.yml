  - "https://cyberinsider.com/asos-credential-stuffing-attack-exposed-data-of-138828-customers/"
  - "https://www.claimdepot.com/data-breach/asos-2026"
  - "https://oag.ca.gov/system/files/ASOS%20US%20Sales%20LLC%20-%20CA-US%20notification.pdf"
